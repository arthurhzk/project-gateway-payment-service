version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: payment_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: payment_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  gateways:
    image: matheusprotzen/gateways-mock
    container_name: payment_gateways
    ports:
      - "3001:3001"
      - "3002:3002"

volumes:
  mysql_data: